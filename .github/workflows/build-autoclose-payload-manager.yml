name: Build Y2JB auto-close with Payload Manager

on:
  push:
    branches: [main]
    paths:
      - 'autoclose-payload-manager/**'
      - '.github/workflows/build-autoclose-payload-manager.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Verify sources
        shell: bash
        run: |
          set -eu
          echo 'a044d046e283f1ea8e97c945278f6767c064e510701a7fa2d3d1276428e72a3a  autoclose-payload-manager/base/download0-autoclose.zip' | sha256sum --check -
          test -s 'autoclose-payload-manager/download0/cache/splash_screen/aHR0cHM6Ly93d3cueW91dHViZS5jb20vdHY=/Relapse.js'
          test -s 'autoclose-payload-manager/download0/cache/splash_screen/aHR0cHM6Ly93d3cueW91dHViZS5jb20vdHY=/Payload_Manager_v0.6.3.elf'

      - name: Patch the original UFS2 image in FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          copyback: true
          run: |
            set -eu
            cd autoclose-payload-manager

            expected_hash=a044d046e283f1ea8e97c945278f6767c064e510701a7fa2d3d1276428e72a3a
            actual_hash=$(sha256 -q base/download0-autoclose.zip)
            test "$actual_hash" = "$expected_hash"

            unzip -p base/download0-autoclose.zip download0.dat > download0.dat
            test "$(stat -f '%z' download0.dat)" = "336789504"

            mkdir -p .build/mnt
            md=$(mdconfig -a -t vnode -f download0.dat)
            mounted=0
            cleanup() {
              if [ "$mounted" -eq 1 ]; then
                umount .build/mnt || true
              fi
              if [ -n "${md:-}" ]; then
                mdconfig -d -u "$md" || true
              fi
            }
            trap cleanup EXIT

            mount -t ufs "/dev/${md}" .build/mnt
            mounted=1
            cache=.build/mnt/cache/splash_screen/aHR0cHM6Ly93d3cueW91dHViZS5jb20vdHY=
            test -d "$cache"
            cp download0/cache/splash_screen/aHR0cHM6Ly93d3cueW91dHViZS5jb20vdHY=/Relapse.js "$cache/Relapse.js"
            cp download0/cache/splash_screen/aHR0cHM6Ly93d3cueW91dHViZS5jb20vdHY=/Payload_Manager_v0.6.3.elf "$cache/Payload_Manager_v0.6.3.elf"
            chmod 0644 "$cache/Relapse.js" "$cache/Payload_Manager_v0.6.3.elf"
            test -s "$cache/Relapse.js"
            test -s "$cache/Payload_Manager_v0.6.3.elf"
            sync

            umount .build/mnt
            mounted=0
            mdconfig -d -u "$md"
            md=
            trap - EXIT

            test "$(stat -f '%z' download0.dat)" -eq 336789504
            sha256 -q download0.dat > download0.dat.sha256
            file download0.dat

      - name: Upload the patched image
        uses: actions/upload-artifact@v4
        with:
          name: download0-dat-autoclose-payload-manager
          path: |
            autoclose-payload-manager/download0.dat
            autoclose-payload-manager/download0.dat.sha256
          if-no-files-found: error
