name: Build Y2JB download0.dat (UFS2)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  ufs-image:
    runs-on: ubuntu-latest
    steps:
      - name: Get source files
        uses: actions/checkout@v4

      - name: Build UFS2 image in FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          copyback: true
          run: |
            set -e
            truncate -s 336789504 download0.dat
            MD=$(mdconfig -a -t vnode -f "$(pwd)/download0.dat")
            newfs -O 2 -b 32768 -f 4096 /dev/${MD}
            mount /dev/${MD} /mnt
            cp -R download0/* /mnt/
            chmod -R 777 /mnt/*
            umount /mnt
            mdconfig -d -u ${MD}
            file download0.dat

      - name: Upload generated image
        uses: actions/upload-artifact@v4
        with:
          name: download0-dat-ufs2
          path: download0.dat
          if-no-files-found: error
