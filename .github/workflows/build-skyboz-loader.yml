name: Build Y2JB SKYBOZ Loader download0.dat

on:
  push:
    branches: [main]
    paths:
      - 'download0/cache/**/Payload_Manager_v0.6.3.elf'
      - 'payloads/Relapse.js'
      - 'payloads/icon-db-helper/**'
      - 'assets/icon0-PPSA01650.png'
      - '.github/workflows/build-skyboz-loader.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current project
        uses: actions/checkout@v4

      - name: Check out retained base image
        uses: actions/checkout@v4
        with:
          ref: 9a513d5343e508154190ea465e56adc64bfe7ad0
          path: .base-source

      - name: Build persistent icon database helper
        shell: bash
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18 python3-pyelftools
          mkdir -p .build-deps
          sdk='.build-deps/ps5-payload-sdk.zip'
          curl -fL 'https://github.com/ps5-payload-dev/sdk/releases/download/v0.41/ps5-payload-sdk.zip' -o "$sdk"
          printf '%s  %s\n' 'ebfb0acb5260511951a80e17db41650c62d20a8caf8659a230b928dc85005984' "$sdk" | sha256sum --check -
          unzip -q "$sdk" -d .build-deps
          sqlite='.build-deps/sqlite-amalgamation.zip'
          curl -fL 'https://www.sqlite.org/2024/sqlite-amalgamation-3460000.zip' -o "$sqlite"
          printf '%s  %s\n' '712a7d09d2a22652fb06a49af516e051979a3984adb067da86760e60ed51a7f5' "$sqlite" | sha256sum --check -
          unzip -q "$sqlite" -d .build-deps
          export PATH="/usr/lib/llvm-18/bin:$PATH"
          export PS5_PAYLOAD_SDK="$GITHUB_WORKSPACE/.build-deps/ps5-payload-sdk"
          export SQLITE_DIR="$GITHUB_WORKSPACE/.build-deps/sqlite-amalgamation-3460000"
          make -C payloads/icon-db-helper
          cache='skyboz-build/download0/cache/splash_screen/aHR0cHM6Ly93d3cueW91dHViZS5jb20vdHY='
          mkdir -p "$cache"
          cp payloads/icon-db-helper/SKYBOZ_IconDB_Helper.elf "$cache/SKYBOZ_IconDB_Helper.elf"
          test -s "$cache/SKYBOZ_IconDB_Helper.elf"

      - name: Assemble build inputs
        shell: bash
        run: |
          set -eu
          base='.base-source/autoclose-payload-manager/base/download0-autoclose.zip'
          expected='a044d046e283f1ea8e97c945278f6767c064e510701a7fa2d3d1276428e72a3a'
          printf '%s  %s\n' "$expected" "$base" | sha256sum --check -
          cache='skyboz-build/download0/cache/splash_screen/aHR0cHM6Ly93d3cueW91dHViZS5jb20vdHY='
          mkdir -p skyboz-build/base "$cache"
          cp "$base" skyboz-build/base/download0-autoclose.zip
          cp payloads/Relapse.js "$cache/Relapse.js"
          cp 'download0/cache/splash_screen/aHR0cHM6Ly93d3cueW91dHViZS5jb20vdHY=/Payload_Manager_v0.6.3.elf' "$cache/Payload_Manager_v0.6.3.elf"
          cp assets/icon0-PPSA01650.png "$cache/SKYBOZ_LOADER_icon0.png"
          cp payloads/icon-db-helper/SKYBOZ_IconDB_Helper.elf "$cache/SKYBOZ_IconDB_Helper.elf"
          test -s "$cache/Relapse.js"
          test -s "$cache/Payload_Manager_v0.6.3.elf"
          test -s assets/icon0-PPSA01650.png
          test -s "$cache/SKYBOZ_IconDB_Helper.elf"

      - name: Patch the UFS2 image in FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          copyback: true
          run: |
            set -eu
            cd skyboz-build
            expected='a044d046e283f1ea8e97c945278f6767c064e510701a7fa2d3d1276428e72a3a'
            actual=$(sha256 -q base/download0-autoclose.zip)
            test "$actual" = "$expected"
            unzip -p base/download0-autoclose.zip download0.dat > download0.dat
            test "$(stat -f '%z' download0.dat)" = "336789504"
            mkdir -p .build/mnt
            md=$(mdconfig -a -t vnode -f download0.dat)
            mounted=0
            cleanup() {
              if [ "$mounted" -eq 1 ]; then umount .build/mnt || true; fi
              if [ -n "$md" ]; then mdconfig -d -u "$md" || true; fi
            }
            trap cleanup EXIT
            mount -t ufs "/dev/$md" .build/mnt
            mounted=1
            cache=.build/mnt/cache/splash_screen/aHR0cHM6Ly93d3cueW91dHViZS5jb20vdHY=
            test -d "$cache"
            cp download0/cache/splash_screen/aHR0cHM6Ly93d3cueW91dHViZS5jb20vdHY=/Relapse.js "$cache/Relapse.js"
            cp download0/cache/splash_screen/aHR0cHM6Ly93d3cueW91dHViZS5jb20vdHY=/Payload_Manager_v0.6.3.elf "$cache/Payload_Manager_v0.6.3.elf"
            cp download0/cache/splash_screen/aHR0cHM6Ly93d3cueW91dHViZS5jb20vdHY=/SKYBOZ_LOADER_icon0.png "$cache/SKYBOZ_LOADER_icon0.png"
            cp download0/cache/splash_screen/aHR0cHM6Ly93d3cueW91dHViZS5jb20vdHY=/SKYBOZ_IconDB_Helper.elf "$cache/SKYBOZ_IconDB_Helper.elf"
            chmod 0644 "$cache/Relapse.js" "$cache/Payload_Manager_v0.6.3.elf" "$cache/SKYBOZ_LOADER_icon0.png" "$cache/SKYBOZ_IconDB_Helper.elf"
            test -s "$cache/Relapse.js"
            test -s "$cache/Payload_Manager_v0.6.3.elf"
            test -s "$cache/SKYBOZ_LOADER_icon0.png"
            test -s "$cache/SKYBOZ_IconDB_Helper.elf"
            sync
            umount .build/mnt
            mounted=0
            mdconfig -d -u "$md"
            md=
            trap - EXIT
            test "$(stat -f '%z' download0.dat)" -eq 336789504
            sha256 -q download0.dat > download0.dat.sha256
            file download0.dat

      - name: Upload the patched image
        uses: actions/upload-artifact@v4
        with:
          name: skyboz-loader-ps5-ready-files
          path: |
            skyboz-build/download0.dat
            skyboz-build/download0.dat.sha256
            assets/icon0-PPSA01650.png
          if-no-files-found: error
